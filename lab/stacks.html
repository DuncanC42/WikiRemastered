<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labo · Piles de doublons</title>
<!-- Visual check of duplicate stacks with the real integration.css. The markup
     mirrors the native collection wrapper; the stacking logic lives in content.js. -->
<link rel="stylesheet" href="../extension/integration.css">
<style>
  body { margin: 0; background: #111113; color: #f5f5f7; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); gap: 28px 20px; max-width: 900px; margin: 0 auto; padding: 40px 24px; }
  .card { position: relative; aspect-ratio: 5 / 7; overflow: hidden; border-radius: 14px; background: var(--frame); box-shadow: 0 10px 24px -10px rgb(0 0 0 / 80%); }
  .card img { display: block; width: 100%; height: 45%; object-fit: cover; }
  .card .chip { position: absolute; top: 8px; left: 8px; padding: 2px 6px; border-radius: 5px; background: var(--rarity); color: #0d1117; font-size: 11px; font-weight: 800; }
  .card h3 { margin: 10px 10px 0; color: #000; font-size: 13px; }
  .extras { padding-top: 10px; color: #a1a1aa; font-size: 11px; }
</style>
</head>
<body>
<main id="grid"></main>
<script>
  const colors = { C: '#b8f2d5', PC: '#b1cff2', R: '#c6a7f2', SR: '#ed6fa3', UR: '#fa9931', L: '#ffe144' };
  const cards = [
    ['Ada Lovelace', 'R', '/cards/ada-lovelace.png', ['C', 'C']],
    ['Abeille', 'PC', '/cards/abeille.jpg', ['C']],
    ['Grande Muraille', 'L', '/cards/grande-muraille.jpg', ['UR', 'SR']],
    ['Einstein', 'UR', '/cards/albert-einstein.jpg', []],
  ];
  const grid = document.getElementById('grid');
  for (const [title, rarity, image, behind] of cards) {
    const wrapper = document.createElement('div');
    wrapper.className = 'relative isolate group';
    wrapper.style.cssText = 'position: relative; isolation: isolate;';
    wrapper.innerHTML = `<div class="card" style="--frame:${colors[rarity]};--rarity:${colors[rarity]}"><img alt="" src="https://www.wiki-masters.com${image}"><span class="chip">${rarity}</span><h3>${title}</h3></div><div class="extras">${behind.length ? `Déplier les ${behind.length + 1} exemplaires` : 'Défausser'}</div>`;
    if (behind.length) {
      wrapper.dataset.wmeStack = String(behind.length + 1);
      wrapper.dataset.wmeStackState = 'closed';
      const layers = document.createElement('div');
      layers.dataset.wme = 'stack-layers';
      for (const r of behind.slice(0, 2)) { const span = document.createElement('span'); span.style.setProperty('--layer', colors[r]); layers.append(span); }
      const badge = document.createElement('b');
      badge.textContent = `×${behind.length + 1}`;
      layers.append(badge);
      wrapper.append(layers);
      requestAnimationFrame(() => { layers.style.height = `${wrapper.firstElementChild.offsetHeight}px`; });
    }
    grid.append(wrapper);
  }
</script>
</body>
</html>
