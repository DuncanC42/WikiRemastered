<!doctype html><html data-wme-theme="graphite"><meta charset="utf-8"><title>Logo test</title>
<style>
body{margin:0;background:#0c0d0c;color:#f5f5f7;font-family:system-ui}
aside{width:300px;height:100vh;background:#121413;border-right:1px solid #1f2321;padding:24px 16px;box-sizing:border-box}
.head{display:flex;align-items:center;justify-content:space-between;padding:0 14px}
h1{font-size:24px;font-weight:700;margin:0}
.bell{width:22px;height:22px;border-radius:50%;background:#333}
.login{position:absolute;left:360px;top:60px;text-align:center}.login h1{font-size:36px}
</style>
<style id="rule"></style>
<aside><div class="head"><a href="/pulls"><h1><span style="color:#3ddc97">Wiki</span><span>Masters</span></h1></a><span class="bell"></span></div></aside>
<div class="login"><h1><span style="color:#3ddc97">Wiki</span><span>Masters</span></h1><p>Collectionnez les cartes Wikipédia</p></div>
<script>
fetch('../extension/site-theme.css').then(r => r.text()).then(css => {
  const i = css.indexOf('/* The WikiRemastered logo');
  document.getElementById('rule').textContent = css.slice(i).replaceAll('chrome-extension://__MSG_@@extension_id__/', '../extension/');
  for (const span of document.querySelectorAll('span')) {
    if (span.textContent === 'Wiki' && span.nextElementSibling?.textContent === 'Masters') span.parentElement.setAttribute('data-wme-logo', '');
  }
});
</script>
